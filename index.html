
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHUNTER007 | PS4 Exploit Host</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

    <!-- WELCOME HEADER -->
    <header class="welcome-header">
        <h1 id="msgs" class="home-title">XHUNTER007</h1>
        <div class="welcome-subtitle">
            PS4 EXPLOIT HOST
        </div>
    </header>

    <!-- FIRMWARE DETECTION -->
    <div id="firmware-status" class="firmware-status">
        CHECKING PS4 FIRMWARE...
    </div>

    <!-- FIRMWARE MENU -->
    <main id="menu">

        <h2 class="section-title">SELECT YOUR FIRMWARE</h2>

        <button class="btn btn-multi menu-btn delay-1"
            onmouseover="showMessage('GoldHEN Multi Firmware Auto Selection')"
            onmouseout="resetMessage()"
            onclick="location.replace('g2all/index.html')">
            GoldHEN Multi FW
        </button>

        <button class="btn menu-btn delay-2"
            onmouseover="showMessage('PS4 5.05 Firmware Host v2.5')"
            onmouseout="resetMessage()"
            onclick="location.replace('505/index.html')">
            5.05 FW v2.5
        </button>

        <button class="btn menu-btn delay-3"
            onmouseover="showMessage('PS4 6.72 FW GoldHEN Host')"
            onmouseout="resetMessage()"
            onclick="location.replace('672goldhen/index.html')">
            6.72 FW GoldHEN
        </button>

        <button class="btn menu-btn delay-4"
            onmouseover="showMessage('PS4 6.72 Firmware Host v3.0')"
            onmouseout="resetMessage()"
            onclick="location.replace('672/index.html')">
            6.72 FW v3.0
        </button>

        <br>

        <button class="btn menu-btn delay-5"
            onmouseover="showMessage('PS4 9.00 FW GoldHEN Host')"
            onmouseout="resetMessage()"
            onclick="location.replace('900goldhen/index.html')">
            9.00 FW GoldHEN
        </button>

        <button class="btn menu-btn delay-6"
            onmouseover="showMessage('PS4 9.00 Firmware Host v3.0')"
            onmouseout="resetMessage()"
            onclick="location.replace('900v3/index.html')">
            9.00 FW v3.0
        </button>

        <br>

        <button class="btn menu-btn delay-7"
            onmouseover="showMessage('Restore Host to User Guide without DNS')"
            onmouseout="resetMessage()"
            onclick="location.replace('restore/index.html')">
            Restore Host
        </button>

    </main>

    <!-- SIGNATURE -->
    <footer class="signature">

        <div class="signature-label">
            Designed by
        </div>

        <div class="signature-name">
            xHuner007
        </div>

    </footer>

    <!-- FIRMWARE DETECTION SCRIPT -->
    <script>

        function showMessage(message) {
            document.getElementById("msgs").textContent = message;
        }

        function resetMessage() {
            document.getElementById("msgs").textContent = "XHUNTER007";
        }

        (function detectFirmware() {

            var firmwareStatus =
                document.getElementById("firmware-status");

            var userAgent = navigator.userAgent || "";

            var match = userAgent.match(
                /PlayStation 4[ /]([\d.]+)/i
            );

            if (match) {

                firmwareStatus.innerHTML =
                    '<span class="status-dot"></span>' +
                    ' PS4 DETECTED | FIRMWARE ' + match[1];

                firmwareStatus.className =
                    "firmware-status detected";

            } else {

                firmwareStatus.textContent =
                    "OPEN ON PS4 TO DETECT FIRMWARE";

                firmwareStatus.className =
                    "firmware-status not-detected";

            }

        })();

    </script>

</body>
</html>
