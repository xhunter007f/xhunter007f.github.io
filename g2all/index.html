<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

#xh-audio-toggle {
    position: fixed;
    right: 18px;
    bottom: 16px;
    z-index: 9999;
    padding: 9px 14px;

<button id="xh-audio-toggle" type="button" aria-pressed="false">♪ SOUND OFF</button>
<script>
(function () {
    var button = document.getElementById("xh-audio-toggle");
    if (!button) return;
    var enabled = false;
    var player = null;

    function makeToneData(frequencies, duration) {
        var rate = 22050;
        var count = Math.floor(rate * duration);
        var bytes = new Uint8Array(44 + count * 2);
        var view = new DataView(bytes.buffer);
        function writeText(offset, value) {
            for (var i = 0; i < value.length; i++) bytes[offset + i] = value.charCodeAt(i);
        }
        writeText(0, "RIFF");
        view.setUint32(4, 36 + count * 2, true);
        writeText(8, "WAVE");
        writeText(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, rate, true);
        view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeText(36, "data");
        view.setUint32(40, count * 2, true);
        for (var n = 0; n < count; n++) {
            var t = n / rate;
            var part = Math.min(frequencies.length - 1, Math.floor(t / (duration / frequencies.length)));
            var local = (t - part * duration / frequencies.length) / (duration / frequencies.length);
            var envelope = Math.min(1, local * 12, (1 - local) * 8);
            var sample = Math.sin(2 * Math.PI * frequencies[part] * t) * envelope * 0.22;
            view.setInt16(44 + n * 2, Math.max(-1, Math.min(1, sample)) * 32767, true);
        }
        var binary = "";
        for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
        return "data:audio/wav;base64," + window.btoa(binary);
    }

    function playNotes(notes, duration) {
        try {
            if (!player) player = new Audio();
            player.pause();
            player.src = makeToneData(notes, duration);
            player.currentTime = 0;
            var result = player.play();
            if (result && result.catch) result.catch(function () {});
        } catch (e) {
            button.textContent = "♪ AUDIO ERROR";
        }
    }

    button.addEventListener("click", function () {
        enabled = !enabled;
        button.setAttribute("aria-pressed", enabled ? "true" : "false");
        button.textContent = enabled ? "♫ SOUND ON" : "♪ SOUND OFF";
        if (enabled) playNotes([220, 329.63, 440, 659.25, 523.25], 1.15);
        else if (player) player.pause();
    });

    document.addEventListener("click", function (event) {
        if (!enabled || event.target === button) return;
        var target = event.target;
        if (target && target.closest && target.closest("a, button, input, select")) {
            playNotes([880, 1174.66], 0.16);
        }
    }, true);
})();
</script>
