<!DOCTYPE html>
<html>
<head>
<title>PS4 Exploit Host by xHunter007</title>
<link rel="stylesheet" href="../style.css">
<style>
/* Requested G2ALL display adjustments only: raise and slightly shrink xHunter007;
   widen the background very slightly while keeping it centered. */
#xhunter-brand {
    top: clamp(14px, 2vh, 24px) !important;
    font-size: clamp(24px, 4vw, 46px) !important;
}

/* Presentation only: keep the exploit loader and firmware routing untouched. */
#menu {
    display: block;
}
#host-title {
    color: #f4eaff;
    text-shadow: 0 0 7px rgba(255, 54, 199, .8), 0 0 16px rgba(45, 220, 255, .45);
}
#msgs {
    display: block;
    width: fit-content;
    max-width: calc(100% - 24px);
    box-sizing: border-box;
    margin: 8px auto 10px !important;
    font-size: clamp(16px, 2.5vw, 25px) !important;
    line-height: 1.35;
}
#special-thanks {
    margin: 8px 0 4px !important;
    font-size: clamp(10px, 1.25vw, 13px) !important;
    line-height: 1.6;
    color: #e8fff8;
}
#designed-by {
    margin: 5px 0 0 !important;
    font-size: 11px !important;
    line-height: 1.4;
    color: rgba(232, 255, 248, .78);
}
#designed-by span {
    color: #C77DFF;
    text-shadow: 0 0 7px #A020F0, 0 0 15px #7B2CFF;
    font-weight: 900;
}
@media (max-width: 600px) {
    #msgs {
        font-size: 15px !important;
        padding: 6px 8px;
    }
    #special-thanks {
        font-size: 9px !important;
    }
    #designed-by {
        font-size: 9px !important;
    }
}
</style>
</head>
<body>
<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>
<div id="xhunter-brand" aria-label="xHunter007">xHunter007</div>
<div id="artwork-labels" aria-hidden="true">
  <span class="artwork-name" id="basbos-name">BasBosa</span>
  <span class="artwork-name" id="rozita-name">RoZita</span>
</div>

</div>

</html>
