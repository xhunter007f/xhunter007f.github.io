<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 5.05 and 7.00 to 14.02";
    });
} else {
    if (window.applicationCache.status == '0') {
        if (fwNum == 5.05 || fwNum == 5.07) {
            window.location.replace("cache505.html");
        } else if (fwNum >= 7.00 && fwNum <= 8.52) {
            window.location.replace("cache700.html");
        } else if (fwNum >= 9.00 && fwNum <= 9.60) {
            window.location.replace("cache900.html");
        } else if (fwNum >= 10.00 && fwNum <= 11.02) {
            window.location.replace("cachecss.html");
        } else if (fwNum >= 11.50 && fwNum <= 14.02) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
        if (fwNum == 5.05 || fwNum == 5.07) {
            var script = document.createElement('script');
            script.src = "505/exploit.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 7.00 && fwNum <= 8.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "700/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 9.00 && fwNum <= 9.60) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "900/alert.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 10.00 && fwNum <= 11.02) {
            var script = document.createElement('script');
            script.src = "css/main.js";
            script.onerror = onScriptError;
            script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
        }
        else if (fwNum == 11.50 || fwNum == 11.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.00 && fwNum <= 14.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

/* xHunter007 original Vice City-inspired sound control */
#xh-audio-toggle {
    position: fixed;
    right: 18px;
    bottom: 16px;
    z-index: 9999;
    padding: 9px 14px;
    border: 1px solid rgba(255, 72, 210, .9);
    border-radius: 5px;
    color: #fff2fc;
    background: rgba(20, 5, 28, .88);
    box-shadow: 0 0 10px rgba(255, 45, 205, .45), inset 0 0 10px rgba(255, 45, 205, .12);
    font: bold 12px Arial, sans-serif;

#xh-audio-toggle:focus { outline: 2px solid #55eaff; }

<button id="xh-audio-toggle" type="button" aria-pressed="false">♪ SOUND OFF</button>
<script>
(function () {
    var button = document.getElementById("xh-audio-toggle");
    if (!button) return;
    var AudioCtor = window.AudioContext || window.webkitAudioContext;
    var audio = null;
    var enabled = false;

    function tone(freq, start, duration, type, volume) {
        if (!audio || !enabled) return;
        var osc = audio.createOscillator();
        var gain = audio.createGain();
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume || 0.045, start + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain);
        gain.connect(audio.destination);
        osc.start(start);
        osc.stop(start + duration + 0.03);
    }

    function intro() {
        var t = audio.currentTime + 0.04;
        var notes = [220, 329.63, 440, 659.25, 523.25];
        for (var i = 0; i < notes.length; i++) {
            tone(notes[i], t + i * 0.13, 0.32, "triangle", 0.035);
        }
        tone(110, t + 0.02, 0.72, "sawtooth", 0.018);
    }

    button.addEventListener("click", function () {
        if (!AudioCtor) {
            button.textContent = "♪ AUDIO N/A";
            return;
        }
        if (!audio) audio = new AudioCtor();
        if (audio.state === "suspended" && audio.resume) audio.resume();
        enabled = !enabled;
        button.setAttribute("aria-pressed", enabled ? "true" : "false");
        button.textContent = enabled ? "♫ SOUND ON" : "♪ SOUND OFF";
        if (enabled) intro();
    });

    document.addEventListener("click", function (event) {
        if (!enabled || event.target === button || !audio) return;
        var target = event.target;
        if (target && (target.closest("a, button, input, select"))) {
            var t = audio.currentTime + 0.01;
            tone(880, t, 0.09, "square", 0.018);
            tone(1174.66, t + 0.045, 0.11, "triangle", 0.014);
        }
    }, true);
})();
</script>
